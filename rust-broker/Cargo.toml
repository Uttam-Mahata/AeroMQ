[package]
name = "rust-broker"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tonic = "0.11"
prost = "0.12"
bytes = "1.5"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"

[build-dependencies]
tonic-build = "0.11"
